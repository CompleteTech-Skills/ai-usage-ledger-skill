name: Conversation export
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  transcript:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full-content export, CLI and source-safety contracts
        run: python -m unittest discover -s tests -p 'test_conversation_export.py' -v
