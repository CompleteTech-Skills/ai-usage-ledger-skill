name: OpenHands usage contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline parser and existing-ledger workflow contracts
        run: python -m unittest discover -s tests -p 'test_openhands_*.py' -v
      - name: Verify standalone CLI
        run: python scripts/openhands_usage.py --help
